async function switchBird(key){if(key===active)return;active=key;setData(key);zoom=1;loading.classList.remove('hide');await load(key);loading.classList.add('hide');Object.entries(rigs).forEach(([k,r])=>r.visible=k===key);if(rigs[key].userData.failed)fallback.classList.add('show');else fallback.classList.remove('show');}
function reset(){rigs[active].children[0].quaternion.setFromEuler(new THREE.Euler(.12,.75,0,'YXZ'));zoom=1;turnQueue=0}
function activity(){lastActivity=performance.now();hint.classList.add('hidden')}
function resize(){const r=hero.getBoundingClientRect();if(renderer)renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(hero);resize();
stage.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId);activity()});stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;velocity.set(dx,dy);const k=Math.PI/Math.max(260,stage.clientWidth*1.6);rigs[active].children[0].quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),dx*k));rigs[active].children[0].quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),dy*k));activity()});stage.addEventListener('pointerup',()=>{drag=false});stage.addEventListener('pointercancel',()=>drag=false);stage.addEventListener('wheel',e=>{e.preventDefault();zoom=THREE.MathUtils.clamp(zoom*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)),.55,3.4);activity()},{passive:false});stage.addEventListener('dblclick',()=>{reset();activity()});stage.addEventListener('keydown',e=>{if(e.key==='0')reset();if(e.key==='+'||e.key==='=')zoom=Math.min(3.4,zoom*1.2);if(e.key==='-')zoom=Math.max(.55,zoom/1.2);if(e.key==='ArrowLeft')turnQueue-=.18;if(e.key==='ArrowRight')turnQueue+=.18;activity()});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchBird(t.dataset.bird)));document.querySelector('#zoomIn').onclick=()=>{zoom=Math.min(3.4,zoom*1.35);activity()};document.querySelector('#zoomOut').onclick=()=>{zoom=Math.max(.55,zoom/1.35);activity()};document.querySelector('#turnLeft').onclick=()=>{turnQueue-=Math.PI/2;activity()};document.querySelector('#turnRight').onclick=()=>{turnQueue+=Math.PI/2;activity()};document.querySelector('#closeup').onclick=()=>{zoom=zoom>2.2?1:2.6;document.querySelector('#closeup').setAttribute('aria-pressed',String(zoom>2.2));activity()};document.querySelector('#expand').onclick=()=>{focus=!focus;hero.classList.toggle('focus',focus);activity()};document.querySelector('#light').onclick=()=>{hero.dataset.light=hero.dataset.light==='day'?'dusk':'day';document.body.style.background=hero.dataset.light==='dusk'?'#14170f':'#f6f1e7';activity()};addEventListener('keydown',e=>{if(e.key==='Escape'&&focus){focus=false;hero.classList.remove('focus')}});
setData(active);load('kingfisher').then(()=>{rigs.kingfisher.visible=true;loading.classList.add('hide');if(rigs.kingfisher.userData.failed||!renderer)fallback.classList.add('show')});load('hoopoe');
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),r=hero.getBoundingClientRect(),sr=stage.getBoundingClientRect();if(!drag&&velocity.lengthSq()>.001){const k=Math.PI/Math.max(260,stage.clientWidth*1.6);rigs[active].children[0].quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),velocity.x*k*dt*5));rigs[active].children[0].quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),velocity.y*k*dt*5));velocity.multiplyScalar(Math.exp(-dt*4.5))}if(!drag&&performance.now()-lastActivity>1800&&!focus){const t=performance.now()/1000,rig=rigs[active];rig.rotation.y=Math.sin(t*.55)*.16;rig.rotation.x=Math.sin(t*.9)*.03;rig.position.y=Math.sin(t*1.3)*.028}else if(drag){rigs[active].rotation.set(0,0,0);rigs[active].position.y=0}if(Math.abs(turnQueue)>.0001){const step=turnQueue*(1-Math.exp(-dt*4.2));rigs[active].children[0].rotateY(step);turnQueue-=step}const px=Math.min(sr.width*.5,sr.height*.6)*1.16;const targetX=focus?r.width/2:sr.left+sr.width/2,targetY=focus?r.height*.5:sr.top+sr.height*.44;const z=r.height/(2*Math.tan(THREE.MathUtils.degToRad(26)/2)*px*zoom);camera.position.set(0,0,z);camera.setViewOffset(r.width,r.height,r.width/2-targetX,r.height/2-targetY,r.width,r.height);camera.lookAt(0,0,0);if(renderer)renderer.render(scene,camera)}frame();
</script>
